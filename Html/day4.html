<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lvl 3</title>
</head>
<body>

    <!--tables in html-->

    <table>
        <caption>Food Menu</caption>

        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Samosa</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>20</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>sum</td>
                <td>42</td>
            </tr>
        </tfoot>
    </table>

    <hr>
    <hr>

    <!--colspan & rowspan-->

    <table border="black">
        <caption>food menu</caption>
        <thead>
            <tr>
                <th rowspan="2">item</th>
                <th colspan="2">price</th>
            </tr>
            <tr>
                <th>inr</th>
                <th>usd</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>frooti</td>
                <td>10</td>
                <td>0.14</td>
            </tr>
            <tr>
                <td>samosa</td>
                <td>12</td>
                <td>0.18</td>
            </tr>
            <tr>
                <td>chips</td>
                <td>20</td>
                <td>0.28</td>
            </tr>
        </tbody>
    </table>

    <hr>
    <hr>
    <!--practice ques 7-->

    <table border="black">
        <caption>A test table with merged cells</caption>

        <thead>
            <tr>
                <th rowspan="2"></th>
                <th colspan="2">Average</th>
                <th rowspan="2">Red eyes</th>
            </tr>
            <tr>
                <th>Height</th>
                <th>Weight</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40&percnt;</td>
            </tr>
            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>
        </tbody>
    </table>


    <!--forms-->
    <!-- <form></form> -->

    <!-- <form action="https://www.google.com/search">  -->

    <hr>
    <hr>

    <!--input-->
    checkbox
    <input type="checkbox">
    password
    <input type="password">
    text
    <input type="text">
    file
    <input type="file">
    time
    <input type="time">

    <hr>
    <hr>

    <!--placeholder-->
    <input type="text" placeholder="enter name">
    <input type="password" placeholder="enter password">


    <!--label-->
    <div>
        <label for="usern">Username:</label>
        <input type="text" placeholder="enter username" id="usern">
    </div>

    <div>
        <label for="pass">Password:</label>
        <input type="text" placeholder="write password" id="pass">
    </div>


    <!--button-->

    <button>Submit</button>
    <button type="submit">type1</button>
    <button type="button">type2</button>
    <button type="reset">reset</button>

    <!--button using input-->
    <input type="submit" value="click">
    <input type="button" value="click">

    <!--name attribute-->   
    <!-- <input type="text" placeholder="username" name="usern"> -->

    <hr>
    <hr>
    <hr>
    <hr>
    <hr>

    <!--practice ques 8-->
    <div>
    <form action="https://www.google.com/search">
    <input type="text" placeholder="search here" name="q">
    <button type="submit">submit</button>
    </form>
    </div>
    
    <!--checkbox-->

    <br><br><br><br><br>
    <div>
        <form action="/server">
            <input type="checkbox" id="age" name="age" checked>
            <label for="age"> Age above 18?</label>
        </form>
    </div>
    

    <hr>
    <hr>
    <hr>
    <hr>
    <hr>

    <!--radio-->

    <div>
        <input type="radio" name="fruit" id="apple" value="apple">
        <label for="apple">apple</label>

        <input type="radio" name="fruit" id="mango" value="mango">
        <label for="mango">mango</label>

        <input type="radio" name="fruit" id="banana" value="banana">
        <label for="banana">banana</label>
    </div>


    <br><br><br><br><br>
    <!--select-->

    <div>
        <select name="proffession" id="prof">
            <label for="prof">Choose your proffession</label>

            <option>Select your option</option>
            <option value="stu">student</option>
            <option value="dev">developer</option>
        </select>
    </div>


    <!--range-->

    <div>
        <label for="vol">Volume</label>
        <input type="range" id="vol" min="0" max="100" name="vol">
    </div>
    

    <!--text area-->

    <div>
        <label for="fb">write ur feedback</label>
        <textarea id="fb" rows="10" cols="100"></textarea>
        
    </div>
</body>
</html>
