<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <div><h1>Registration Form</h1></div>
    <form action="/action">

    <div>
        <input type="text" placeholder="First Name" name="FirNam">
        <input type="text" placeholder="Last Name" name="LaNa">
    </div>

    <div>
        <label for="gender">Please select gender</label>
        <select name="gender" id="gender">
            
            <option value="m">Male</option>
            <option value="f">Female</option>
        </select>
    </div>

    <div>
        <label for="agree">Do you agree to all terms of service?</label>
        <input type="checkbox" id="agree" name="agree">
        <label for="agree">Yes, I agree</label>
    </div>

    <div>
        <button type="submit">Register</button>
    </div>
    </form>

</body>
</html>
